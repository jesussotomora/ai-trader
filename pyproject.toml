[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trader"
version = "0.1.0"
description = "Autonomous Multi-LLM Trading Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "newspaper3k>=0.2.8",
    "lxml_html_clean>=0.1.0",
    "nltk>=3.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0"
]
